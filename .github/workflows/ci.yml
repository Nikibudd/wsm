name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Runs tsc, not just the tests: babel-jest strips types without
      # checking them, so `npm test` passing alone doesn't guarantee the
      # TypeScript actually compiles — this step is what catches that.
      - run: npm run build

      - run: npm test
